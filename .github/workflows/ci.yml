name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm knip && pnpm test && pnpm typecheck && pnpm build
      - run: pnpm test:e2e
      - name: Test x64 full-page model reference
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm exec vitest run --config vitest.models.config.ts -t "ONNX Runtime CPU PP-OCRv4/chinese_cht_PP-OCRv3_rec_mobile"
      - run: pnpm test:models
        if: matrix.os == 'macos-15'
        env:
          RAPIDOCR_TEST_COREML: '1'
          RAPIDOCR_TEST_WEBGPU: '1'
