name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm CLI with Trusted Publishing support
        run: npm install --global npm@11.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm run test:e2e
      - run: pnpm run test:models
      - name: Pack and verify the npm package
        run: |
          package_directory="$RUNNER_TEMP/rapidocr-release-package"
          mkdir -p "$package_directory"
          pnpm pack --pack-destination "$package_directory"
          archive="$(find "$package_directory" -maxdepth 1 -name 'rapidocr-node-*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -qx 'package/dist/index.mjs'
          tar -tzf "$archive" | grep -qx 'package/dist/cli.mjs'
          node --input-type=module - "$archive" <<'NODE'
          import { execFileSync } from 'node:child_process'

          const archive = process.argv[2]
          const manifest = JSON.parse(execFileSync('tar', ['-xOzf', archive, 'package/package.json'], { encoding: 'utf8' }))
          const fields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']
          const unresolved = fields.flatMap(field => Object.entries(manifest[field] ?? {})
            .filter(([, range]) => range.startsWith('catalog:') || range.startsWith('workspace:'))
            .map(([name, range]) => `${field}.${name}: ${range}`))

          if (unresolved.length > 0) {
            console.error(`Unresolved workspace dependency protocols in package manifest:\n${unresolved.join('\n')}`)
            process.exit(1)
          }
          NODE
      - name: Generate GitHub release notes
        run: pnpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure GitHub release exists
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        run: |
          archive="$(find "$RUNNER_TEMP/rapidocr-release-package" -maxdepth 1 -name 'rapidocr-node-*.tgz' -print -quit)"
          test -n "$archive"
          npm publish "$archive" --access public
